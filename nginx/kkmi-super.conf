# nginx vhost: kkmi-super.diyarbek.uz → KKMI provider admin SPA (127.0.0.1:8032).
#
# Deliberately a separate origin from the institute panel: the two SPAs are the
# security boundary. Same-origin would let an XSS in the institute panel reach
# this one's session storage.

server {
    listen 80;
    listen [::]:80;
    server_name kkmi-super.diyarbek.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kkmi-super.diyarbek.uz;

    ssl_certificate     /etc/letsencrypt/live/kkmi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kkmi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Release bundles are uploaded from this panel.
    client_max_body_size 200M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8032;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
