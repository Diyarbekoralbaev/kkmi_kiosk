# nginx vhost: status.kioska.dbc.uz → Gatus status page (container on 127.0.0.1:8005)
# Public, read-only status dashboard. Gatus itself has no admin login — the page
# is safe to expose. Internal component URLs are hidden via Gatus `ui.hide-url`.
#
# Cert is a standalone single-domain cert (NOT the kiosk-gov multi-SAN), issued
# separately for this host.

server {
    listen 80;
    listen [::]:80;
    server_name status.kioska.dbc.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.kioska.dbc.uz;

    ssl_certificate     /etc/letsencrypt/live/status.kioska.dbc.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.kioska.dbc.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Basic auth — boss does not want this public. Single login `sharyar`;
    # password hash lives in /etc/nginx/.htpasswd-status on the server only
    # (NOT in git). Gatus's own polling of the backend is over the docker
    # network, so this gate does not affect monitoring.
    location / {
        auth_basic "Kiosk status — restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-status;

        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
