# nginx vhost: kenes-api.kioska.dbc.uz → Joqarı Keńes backend (FastAPI + WS)
# Co-located with kiosk_gov on the same host — distinct filename + subdomain +
# port (8011) so it never collides with kiosk_gov's kiosk-api.conf (8001).
# TLS: multi-SAN cert at /etc/letsencrypt/live/joqari-kenes/.

server {
    listen 80;
    listen [::]:80;
    server_name kenes-api.kioska.dbc.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kenes-api.kioska.dbc.uz;

    ssl_certificate     /etc/letsencrypt/live/joqari-kenes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joqari-kenes/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 200M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── WebSocket (kiosk voice) — long-lived, no buffering ──────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # ── REST API (everything else) ──────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
