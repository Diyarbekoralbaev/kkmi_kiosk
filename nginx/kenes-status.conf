# nginx vhost: kenes-status.kioska.dbc.uz → Joqarı Keńes Gatus status page (8015).
# Uses the joqari-kenes multi-SAN cert (kenes-status is one of its SANs).
# Basic-auth gated; htpasswd lives at /etc/nginx/.htpasswd-kenes-status on the
# server only (NOT in git). Gatus polls the backend over the docker network, so
# this gate doesn't affect monitoring.

server {
    listen 80;
    listen [::]:80;
    server_name kenes-status.kioska.dbc.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kenes-status.kioska.dbc.uz;

    ssl_certificate     /etc/letsencrypt/live/joqari-kenes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joqari-kenes/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        auth_basic "Joqarı Keńes status — restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-kenes-status;

        proxy_pass http://127.0.0.1:8015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
