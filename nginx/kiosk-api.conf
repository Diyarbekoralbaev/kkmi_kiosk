# nginx vhost: api.kioska.dbc.uz → backend (FastAPI + WS)
# Drop into /etc/nginx/sites-available/, symlink to sites-enabled, reload.
#
# TLS: multi-SAN cert at /etc/letsencrypt/live/kiosk-gov/ (issued by
# install-cloudflare-cert.sh, also used by the other two kiosk vhosts).

server {
    listen 80;
    listen [::]:80;
    server_name api.kioska.dbc.uz;

    # Harmless if certbot stays on DNS-01 — keep for emergency HTTP-01 fallback.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kioska.dbc.uz;

    ssl_certificate     /etc/letsencrypt/live/kiosk-gov/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiosk-gov/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Big upload allowance for kiosk binary uploads via super-admin panel.
    client_max_body_size 200M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── WebSocket (kiosk voice) — long-lived, no buffering ──────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # ── REST API (everything else) ──────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
