# nginx vhost: kkmi-api.diyarbek.uz → KKMI backend (127.0.0.1:8031).
#
# This is the hostname the KIOSKS talk to. Two consequences:
#   - it must stay stable: each kiosk stores it at enrollment and production
#     builds pin the certificate, so renaming it means re-enrolling every unit;
#   - /ws/ carries the live voice session, so it needs the upgrade headers and
#     a long read timeout — a visitor pausing mid-conversation must not be
#     disconnected by nginx.

server {
    listen 80;
    listen [::]:80;
    server_name kkmi-api.diyarbek.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kkmi-api.diyarbek.uz;

    ssl_certificate     /etc/letsencrypt/live/kkmi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kkmi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Kiosk release bundles are uploaded through this vhost.
    client_max_body_size 200M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /ws/ {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
