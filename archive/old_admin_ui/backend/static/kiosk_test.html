<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiosk Voice Test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; background: #111; color: #eee; }
  button { padding: 12px 32px; font-size: 18px; margin: 8px; border: none; border-radius: 8px; cursor: pointer; }
  #startBtn { background: #4caf50; color: #fff; }
  #stopBtn { background: #f44336; color: #fff; }
  button:disabled { opacity: 0.4; cursor: default; }
  #status { margin: 16px 0; padding: 12px; background: #222; border-radius: 8px; min-height: 24px; }
  #transcript { margin: 16px 0; padding: 12px; background: #1a1a2e; border-radius: 8px; min-height: 80px; white-space: pre-wrap; }
  .label { color: #888; font-size: 13px; margin-bottom: 4px; }
</style>
</head>
<body>
<h2>Kiosk Voice Test</h2>

<select id="micSelect" style="padding:8px;margin:8px;background:#222;color:#eee;border:1px solid #555;border-radius:4px;"></select>
<button id="enumBtn" onclick="enumDevices()">Refresh Mics</button>
<br>
<button id="startBtn" onclick="start()">Start</button>
<button id="stopBtn" onclick="stop()" disabled>Stop</button>

<div class="label">Status</div>
<div id="status">Ready — click "Refresh Mics" first</div>

<div class="label">Transcript</div>
<div id="transcript"></div>

<script>
const host = location.hostname || 'localhost';
const port = location.port || '3003';
const WS_URL = `ws://${host}:${port}/ws/kiosk/voice`;
const INPUT_RATE = 16000;
const OUTPUT_RATE = 24000;

let ws, audioCtx, micStream, scriptNode;
let playQueue = [];
let playing = false;

async function enumDevices() {
  try {
    // This triggers permission prompt
    const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    tempStream.getTracks().forEach(t => t.stop());

    const devices = await navigator.mediaDevices.enumerateDevices();
    const sel = document.getElementById('micSelect');
    sel.innerHTML = '';
    devices.filter(d => d.kind === 'audioinput').forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || 'Mic ' + d.deviceId.slice(0,8);
      sel.appendChild(opt);
    });
    log('Found ' + sel.options.length + ' mic(s). Select one and click Start.');
  } catch(e) {
    log('Mic permission error: ' + e.message);
  }
}

function log(msg) {
  document.getElementById('status').textContent = msg;
  console.log(msg);
}

async function start() {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('transcript').textContent = '';
  log('Connecting...');

  audioCtx = new AudioContext({ sampleRate: INPUT_RATE });
  playQueue = [];
  playing = false;

  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = async () => {
    log('Connected. Requesting mic...');
    try {
      const deviceId = document.getElementById('micSelect').value;
      const constraints = deviceId ? { audio: { deviceId: { exact: deviceId } } } : { audio: true };
      micStream = await navigator.mediaDevices.getUserMedia(constraints);
      const source = audioCtx.createMediaStreamSource(micStream);
      // 4096 frames buffer, mono in, mono out
      scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
      scriptNode.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const float32 = e.inputBuffer.getChannelData(0);
        // Convert float32 -> int16 PCM
        const pcm16 = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          let s = Math.max(-1, Math.min(1, float32[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        ws.send(pcm16.buffer);
      };
      source.connect(scriptNode);
      scriptNode.connect(audioCtx.destination);
      log('Mic active. Speak now.');
    } catch (err) {
      log('Mic error: ' + err.message);
    }
  };

  ws.onmessage = (evt) => {
    if (evt.data instanceof ArrayBuffer) {
      // Audio from Gemini — queue for playback
      playQueue.push(evt.data);
      if (!playing) playAudio();
    } else {
      // JSON message
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'transcript') {
          document.getElementById('transcript').textContent += msg.text + '\n';
        } else if (msg.type === 'audio_done') {
          // Turn finished
        } else if (msg.type === 'disconnected') {
          log('Provider disconnected: ' + msg.reason);
        }
      } catch (e) {}
    }
  };

  ws.onclose = () => log('WebSocket closed');
  ws.onerror = (e) => log('WebSocket error');
}

async function playAudio() {
  if (playing || playQueue.length === 0) return;
  playing = true;

  // Create a playback AudioContext at 24kHz output rate
  const playCtx = new AudioContext({ sampleRate: OUTPUT_RATE });

  while (playQueue.length > 0) {
    const chunk = playQueue.shift();
    const int16 = new Int16Array(chunk);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) {
      float32[i] = int16[i] / 0x7FFF;
    }
    const buf = playCtx.createBuffer(1, float32.length, OUTPUT_RATE);
    buf.getChannelData(0).set(float32);
    const src = playCtx.createBufferSource();
    src.buffer = buf;
    src.connect(playCtx.destination);
    src.start();
    // Wait for chunk to finish playing
    await new Promise(r => setTimeout(r, (float32.length / OUTPUT_RATE) * 1000));
  }

  await playCtx.close();
  playing = false;
  // Check if more audio arrived while playing
  if (playQueue.length > 0) playAudio();
}

function stop() {
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (ws) { ws.close(); ws = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  playQueue = [];
  playing = false;
  log('Stopped');
}
</script>
</body>
</html>
