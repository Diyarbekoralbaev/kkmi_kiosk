<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nókis qalası hákimiyatı</title>
<script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
<style>
  :root {
    --kk-blue: #008eb7;
    --kk-yellow: #f7bd29;
    --kk-green: #209c3a;
    --kk-red: #da251d;
    --bg: #f5f8fc;
    --bg2: #e8eff6;
    --panel: #ffffff;
    --panel2: #f0f5fa;
    --border: #d9e1eb;
    --text: #0b1e33;
    --text-dim: #4a5d74;
    --muted: #7a8b9e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 10%, rgba(0,142,183,0.08), transparent 60%),
      radial-gradient(circle at 80% 90%, rgba(32,156,58,0.06), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .app {
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    height: 100vh;
    max-width: 1080px;
    margin: 0 auto;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 28px 48px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  header .emblem {
    width: 84px;
    height: 84px;
    flex-shrink: 0;
    background: radial-gradient(circle, rgba(0,142,183,0.2) 0%, transparent 70%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
  }
  header .titles { flex: 1; min-width: 0; }
  header h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 0.3px;
    line-height: 1.1;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header p {
    margin: 6px 0 0;
    font-size: 20px;
    color: var(--text-dim);
  }
  header button.settings {
    background: white;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 24px;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(11, 30, 51, 0.06);
  }
  header button.settings:hover { color: var(--kk-blue); border-color: var(--kk-blue); }

  /* Stage area (robot + transcript) */
  .stage {
    position: relative;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 48px;
  }

  /* Robot avatar — Lottie player */
  .robot {
    width: 480px;
    height: 480px;
    flex-shrink: 0;
    position: relative;
    margin-bottom: 8px;
    filter: drop-shadow(0 20px 40px rgba(11, 30, 51, 0.12));
    transition: transform 0.3s ease;
  }
  .robot dotlottie-player { width: 100%; height: 100%; }

  /* Robot scale with audio when AI speaks */
  .robot.speaking { transform: scale(var(--robot-scale, 1)); }

  /* Scanning rings around the robot */
  .robot-ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .robot-ring.r1 {
    inset: 30px;
    border: 1px dashed rgba(0, 200, 255, 0.35);
    border-top-color: rgba(0, 240, 255, 1);
    animation: ringSpin 8s linear infinite;
  }
  .robot-ring.r2 {
    inset: 14px;
    border: 1px solid rgba(0, 180, 230, 0.15);
    border-left-color: rgba(0, 220, 255, 0.7);
    animation: ringSpin 14s linear infinite reverse;
  }
  .robot-ring.r3 {
    inset: -10px;
    border: 1px solid rgba(0, 200, 255, 0.08);
    border-bottom-color: rgba(0, 220, 255, 0.4);
    animation: ringSpin 20s linear infinite;
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }

  /* Particle dots */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #00e5ff;
    border-radius: 50%;
    box-shadow: 0 0 8px #00e5ff;
    pointer-events: none;
    animation: twinkle 3s ease-in-out infinite;
  }
  .particle:nth-child(1) { top: 10%; left: 18%;  animation-delay: 0s; }
  .particle:nth-child(2) { top: 22%; right: 8%;  animation-delay: 0.8s; width: 3px; height: 3px; }
  .particle:nth-child(3) { bottom: 18%; left: 12%; animation-delay: 1.6s; width: 5px; height: 5px; }
  .particle:nth-child(4) { bottom: 8%;  right: 20%; animation-delay: 0.4s; }
  .particle:nth-child(5) { top: 45%;   right: 2%;  animation-delay: 2.2s; width: 3px; height: 3px; }
  .particle:nth-child(6) { top: 60%;   left: 3%;   animation-delay: 1.2s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%      { opacity: 1;   transform: scale(1.3); }
  }

  /* Eye blink */
  @keyframes blink {
    0%, 93%, 100% { opacity: 1; transform: scaleY(1); }
    95%, 98%      { opacity: 0.15; transform: scaleY(0.08); }
  }
  .eye-group { animation: blink 6s ease-in-out infinite; transform-origin: 100px 100px; transform-box: fill-box; }

  /* Antenna glow */
  @keyframes antennaPulse {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }
  .antenna-dot { animation: antennaPulse 2s ease-in-out infinite; }

  /* Breathing */
  @keyframes breathe {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(0, -8px); }
  }
  .robot-body { animation: breathe 5s ease-in-out infinite; }

  /* Scanning line effect */
  @keyframes scanLine {
    0%, 100% { transform: translateY(0); opacity: 0.8; }
    50%      { transform: translateY(12px); opacity: 0.3; }
  }
  .scan-line { animation: scanLine 3s ease-in-out infinite; }

  /* Active state */
  .robot.active .eye-core { fill: #00f5ff; }
  .robot.active .eye-halo { opacity: 0.6; }
  .robot.speaking .eye-group { animation: blink 2s ease-in-out infinite; }

  /* Transcript scroll */
  .bubbles {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 6px;
  }
  .bubble {
    max-width: 80%;
    padding: 16px 22px;
    border-radius: 22px;
    font-size: 20px;
    line-height: 1.4;
    word-wrap: break-word;
    box-shadow: 0 4px 18px rgba(11, 30, 51, 0.08);
  }
  .bubble.user {
    align-self: flex-end;
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .bubble.ai {
    align-self: flex-start;
    background: linear-gradient(135deg, #e8f6fc 0%, #d1ecf6 100%);
    border: 1px solid rgba(0, 142, 183, 0.25);
    color: var(--text);
  }

  /* Mic button area / orb */
  .mic-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px 48px;
  }
  .orb-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .orb-ring {
    position: absolute;
    border-radius: 50%;
    transition: background 0.5s ease, border-color 0.5s ease;
    will-change: transform, opacity;
  }
  /* Outer halo — fades with volume */
  .orb-ring.outer {
    width: 190px; height: 190px;
    background: radial-gradient(circle, rgba(0,142,183,0.3) 0%, transparent 70%);
    filter: blur(14px);
    opacity: 0.4;
  }
  /* Middle ring */
  .orb-ring.middle {
    width: 140px; height: 140px;
    border: 2px solid rgba(0,142,183,0.4);
    box-shadow: 0 0 30px 3px rgba(0,142,183,0.25), inset 0 0 30px rgba(0,142,183,0.2);
  }
  /* Core sphere */
  .orb-core {
    position: relative;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #6fd1ef 0%, #2aa3d1 30%, #006c8d 60%, #003a4f 100%);
    box-shadow:
      0 10px 30px rgba(11, 30, 51, 0.22),
      0 0 40px 6px rgba(0,142,183,0.35),
      inset 0 -14px 22px rgba(0,0,0,0.3),
      inset 0 8px 22px rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 2px 8px rgba(0,0,0,0.35);
    transition: background 0.5s ease;
    overflow: hidden;
  }
  .orb-core::before {
    /* inner highlight */
    content: '';
    position: absolute;
    top: 10%; left: 20%;
    width: 50%;
    height: 35%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.6), transparent 70%);
    pointer-events: none;
  }
  /* Idle state — soft blue */
  .orb-wrap.idle .orb-core {
    background: radial-gradient(circle at 35% 30%, #e8f0fa 0%, #a8c3da 35%, #6a89a8 75%);
    box-shadow:
      0 10px 30px rgba(11, 30, 51, 0.2),
      0 0 30px 4px rgba(0, 142, 183, 0.15),
      inset 0 -12px 20px rgba(0,0,0,0.15),
      inset 0 8px 20px rgba(255,255,255,0.45);
    color: #0b1e33;
  }
  .orb-wrap.idle .orb-ring.middle { border-color: rgba(0,142,183,0.3); box-shadow: 0 0 30px 2px rgba(0,142,183,0.15), inset 0 0 30px rgba(0,142,183,0.1); }
  .orb-wrap.idle .orb-ring.outer  { background: radial-gradient(circle, rgba(0,142,183,0.2), transparent 70%); }
  /* Connecting — yellow */
  .orb-wrap.connecting .orb-core { background: radial-gradient(circle at 35% 30%, #ffe58a 0%, #d99e1a 35%, #604100 80%); }
  .orb-wrap.connecting .orb-ring.middle { border-color: rgba(247,189,41,0.5); }
  .orb-wrap.connecting .orb-ring.outer  { background: radial-gradient(circle, rgba(247,189,41,0.3), transparent 70%); }
  /* Error — red */
  .orb-wrap.error .orb-core { background: radial-gradient(circle at 35% 30%, #ff9a91 0%, #c0342a 40%, #3a0d0a 85%); }
  .orb-wrap.error .orb-ring.middle { border-color: rgba(231,76,60,0.5); }
  .orb-wrap.error .orb-ring.outer  { background: radial-gradient(circle, rgba(231,76,60,0.3), transparent 70%); }

  /* Idle breathing animation */
  @keyframes breathe {
    0%, 100% { transform: scale(1);    opacity: 0.5; }
    50%      { transform: scale(1.05); opacity: 0.7; }
  }
  .orb-wrap.idle .orb-ring.outer,
  .orb-wrap.connecting .orb-ring.outer {
    animation: breathe 3s ease-in-out infinite;
  }
  .hint {
    font-size: 24px;
    color: var(--text-dim);
    text-align: center;
  }

  /* Footer */
  footer {
    padding: 20px 48px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .flag-strip {
    height: 24px;
    border-radius: 4px;
    margin: 0 auto 12px;
    max-width: 500px;
    background: linear-gradient(
      to bottom,
      var(--kk-blue)   0%, var(--kk-blue)   33%,
      var(--kk-red)    33%, var(--kk-red)   34%,
      white            34%, white           35%,
      var(--kk-yellow) 35%, var(--kk-yellow) 65%,
      white            65%, white           66%,
      var(--kk-red)    66%, var(--kk-red)   67%,
      var(--kk-green)  67%, var(--kk-green) 100%
    );
  }
  footer p {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }

  /* Error banner */
  .error-banner {
    margin: 16px 48px 0;
    padding: 16px 20px;
    background: rgba(231,76,60,0.12);
    border: 2px solid #e74c3c;
    border-radius: 12px;
    color: #e74c3c;
    font-size: 20px;
    display: none;
  }
  .error-banner.show { display: block; }

  /* Settings modal */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(11, 30, 51, 0.3);
  }
  .modal h2 { margin: 0 0 24px; font-size: 28px; }
  .modal label { display: block; color: var(--kk-yellow); font-size: 18px; margin-bottom: 10px; font-weight: 600; }
  .modal select, .modal input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 18px;
    margin-bottom: 24px;
  }
  .modal .btn-row { display: flex; gap: 12px; justify-content: flex-end; }
  .modal button {
    padding: 14px 28px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal button.primary { background: var(--kk-blue); color: white; }
  .modal button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="emblem">🏛️</div>
    <div class="titles">
      <h1>Nókis qalası hákimiyatı</h1>
      <p>Sanlıq kómekshi</p>
    </div>
    <button class="settings" onclick="openSettings()">⚙</button>
  </header>

  <div class="error-banner" id="errorBanner"></div>

  <div class="stage" id="stage">
    <div class="robot" id="robot">
      <dotlottie-player
        src="https://lottie.host/c86b732b-9514-4916-bb3f-15d52764a3cf/eAUn6HxweM.lottie"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </dotlottie-player>
    </div>

    <div class="bubbles" id="transcript"></div>
  </div>
  <!-- /stage -->

  <div class="mic-area">
    <div class="orb-wrap idle" id="orbWrap" onclick="toggleSession()">
      <div class="orb-ring outer" id="orbOuter"></div>
      <div class="orb-ring middle" id="orbMiddle"></div>
      <div class="orb-core" id="orbCore">🎤</div>
    </div>
    <div class="hint" id="hint">Sóylesiw ushın basıń</div>
  </div>

  <footer>
    <div class="flag-strip"></div>
    <p>Qaraqalpaqstan Respublikası</p>
  </footer>
</div>

<!-- Settings modal -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>Sazlaw</h2>
    <label>Mikrofon</label>
    <select id="micSelect"></select>
    <label>Server URL</label>
    <input id="wsUrl" type="text">
    <div class="btn-row">
      <button class="secondary" onclick="closeSettings()">Biykarlaw</button>
      <button class="primary" onclick="saveSettings()">Saqlaw</button>
    </div>
  </div>
</div>

<script>
// ─── Config ────────────────────────────────────────────────────────────────
const DEFAULT_WS_URL = (() => {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const host = location.host || `localhost:3003`;
  return `${proto}//${host}/ws/kiosk/voice`;
})();
const INPUT_RATE = 16000;
const OUTPUT_RATE = 24000;

const STATE = {
  IDLE: 'idle',
  CONNECTING: 'connecting',
  ACTIVE: 'active',
  DISCONNECTING: 'disconnecting',
  ERROR: 'error',
};

// ─── DOM helpers ───────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const orbWrap = $('orbWrap');
const orbOuter = $('orbOuter');
const orbMiddle = $('orbMiddle');
const orbCore = $('orbCore');
const hint = $('hint');
const transcript = $('transcript');
const errorBanner = $('errorBanner');

let currentState = STATE.IDLE;
function setState(s, errMsg) {
  currentState = s;
  orbWrap.classList.remove('idle', 'connecting', 'active', 'error');
  errorBanner.classList.remove('show');
  switch (s) {
    case STATE.IDLE:
      orbWrap.classList.add('idle');
      setRobotState('idle');
      hint.textContent = 'Sóylesiw ushın basıń';
      break;
    case STATE.CONNECTING:
      orbWrap.classList.add('connecting');
      setRobotState('idle');
      hint.textContent = 'Jalanba...';
      break;
    case STATE.ACTIVE:
      setRobotState('active');
      hint.textContent = 'Tıńlap turman... (Toqtatıw ushın basıń)';
      break;
    case STATE.DISCONNECTING:
      orbWrap.classList.add('idle');
      setRobotState('idle');
      hint.textContent = 'Ayaqlanba...';
      break;
    case STATE.ERROR:
      orbWrap.classList.add('error');
      setRobotState('idle');
      hint.textContent = 'Qaytadan urınıp kóriń';
      errorBanner.textContent = errMsg || 'Qátelik júz berdi';
      errorBanner.classList.add('show');
      break;
  }
}

const robot = $('robot');
const stage = $('stage');

function setRobotState(s) {
  robot.classList.remove('active', 'speaking');
  if (s === 'active') robot.classList.add('active');
  if (s === 'speaking') robot.classList.add('active', 'speaking');
}

// Transcript
function clearTranscript() {
  transcript.innerHTML = '';
}
function showWelcome() {
  // Robot replaces welcome text — nothing to render in transcript area.
  transcript.innerHTML = '';
}
function addBubble(speaker, text) {
  const el = document.createElement('div');
  el.className = 'bubble ' + speaker;
  el.textContent = text;
  transcript.appendChild(el);
  stage.scrollTop = stage.scrollHeight;
}

// ─── Audio state ───────────────────────────────────────────────────────────
let ws = null;
let micCtx = null;      // 16kHz AudioContext for capture
let playCtx = null;     // 24kHz AudioContext for playback
let micStream = null;
let micSource = null;
let micProcessor = null;
let nextPlayTime = 0;   // scheduling pointer for gapless playback

// ─── PCM playback + audio-reactive orb ───────────────────────────────────
// Chain: BufferSource → analyser → destination. The analyser feeds the orb
// animation loop so the sphere pulses in sync with AI voice.
let analyser = null;
let analyserData = null;
let orbRafId = null;
let orbLevel = 0; // smoothed 0..1

function playPcmChunk(int16) {
  if (!playCtx) return;
  if (int16.length === 0) return;

  const buffer = playCtx.createBuffer(1, int16.length, OUTPUT_RATE);
  const ch = buffer.getChannelData(0);
  for (let i = 0; i < int16.length; i++) {
    ch[i] = int16[i] / 32768;
  }

  const src = playCtx.createBufferSource();
  src.buffer = buffer;
  if (analyser) {
    src.connect(analyser);
  } else {
    src.connect(playCtx.destination);
  }

  const now = playCtx.currentTime;
  const start = Math.max(now, nextPlayTime);
  src.start(start);
  nextPlayTime = start + buffer.duration;
}

function startOrbAnimation() {
  function tick() {
    let target = 0;
    if (analyser && analyserData) {
      analyser.getByteFrequencyData(analyserData);
      let sum = 0;
      for (let i = 0; i < analyserData.length; i++) sum += analyserData[i];
      const avg = sum / analyserData.length / 255; // 0..1
      target = Math.min(1, avg * 2.0); // boost
    }
    // Smooth
    orbLevel += (target - orbLevel) * 0.25;

    const coreScale = 1 + orbLevel * 0.18;
    const middleScale = 1 + orbLevel * 0.35;
    const outerScale = 1 + orbLevel * 0.55;
    const outerOpacity = 0.35 + orbLevel * 0.55;

    orbCore.style.transform = `scale(${coreScale})`;
    orbMiddle.style.transform = `scale(${middleScale})`;
    orbOuter.style.transform = `scale(${outerScale})`;
    orbOuter.style.opacity = outerOpacity;

    // Robot breathes with volume
    if (robot) {
      const rScale = 1 + orbLevel * 0.06;
      robot.style.setProperty('--robot-scale', rScale);
      if (orbLevel > 0.05) robot.classList.add('speaking');
      else robot.classList.remove('speaking');
    }

    orbRafId = requestAnimationFrame(tick);
  }
  if (!orbRafId) orbRafId = requestAnimationFrame(tick);
}

function stopOrbAnimation() {
  if (orbRafId) cancelAnimationFrame(orbRafId);
  orbRafId = null;
  orbLevel = 0;
  orbCore.style.transform = '';
  orbMiddle.style.transform = '';
  orbOuter.style.transform = '';
  orbOuter.style.opacity = '';
}

// ─── Mic capture: resample 48kHz (browser native) → 16kHz PCM16 ────────────
// Using ScriptProcessorNode with buffer 4096 @ whatever sample rate.
// We create the AudioContext at 16000 Hz so the browser downsamples for us.
async function startMic() {
  const savedMicId = localStorage.getItem('kiosk_mic_id') || undefined;
  const constraints = {
    audio: savedMicId
      ? { deviceId: { exact: savedMicId }, channelCount: 1, echoCancellation: true, noiseSuppression: true }
      : { channelCount: 1, echoCancellation: true, noiseSuppression: true },
  };
  micStream = await navigator.mediaDevices.getUserMedia(constraints);
  micCtx = new AudioContext({ sampleRate: INPUT_RATE });
  if (micCtx.state === 'suspended') await micCtx.resume();

  micSource = micCtx.createMediaStreamSource(micStream);
  micProcessor = micCtx.createScriptProcessor(2048, 1, 1);

  micProcessor.onaudioprocess = (evt) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const input = evt.inputBuffer.getChannelData(0);
    // Float32 → Int16 LE
    const int16 = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      let s = Math.max(-1, Math.min(1, input[i]));
      int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    ws.send(int16.buffer);
  };

  micSource.connect(micProcessor);
  micProcessor.connect(micCtx.destination);
}

async function stopMic() {
  try {
    if (micProcessor) { micProcessor.disconnect(); micProcessor.onaudioprocess = null; }
    if (micSource) micSource.disconnect();
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (micCtx && micCtx.state !== 'closed') await micCtx.close();
  } catch (_) {}
  micProcessor = null;
  micSource = null;
  micStream = null;
  micCtx = null;
}

async function startPlayback() {
  playCtx = new AudioContext({ sampleRate: OUTPUT_RATE });
  if (playCtx.state === 'suspended') await playCtx.resume();
  nextPlayTime = 0;

  // Audio-reactive chain: source → analyser → destination
  analyser = playCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.7;
  analyser.connect(playCtx.destination);
  analyserData = new Uint8Array(analyser.frequencyBinCount);
  startOrbAnimation();
}

async function stopPlayback() {
  stopOrbAnimation();
  analyser = null;
  analyserData = null;
  try {
    if (playCtx && playCtx.state !== 'closed') await playCtx.close();
  } catch (_) {}
  playCtx = null;
  nextPlayTime = 0;
}

// ─── WebSocket ─────────────────────────────────────────────────────────────
function wsUrl() {
  const saved = localStorage.getItem('kiosk_ws_url');
  if (!saved) return DEFAULT_WS_URL;
  // Prevent mixed-content: if page is HTTPS, never use ws:// from localStorage
  if (location.protocol === 'https:' && saved.startsWith('ws://')) {
    return DEFAULT_WS_URL;
  }
  return saved;
}

async function startSession() {
  if (currentState !== STATE.IDLE && currentState !== STATE.ERROR) return;
  setState(STATE.CONNECTING);
  clearTranscript();
  showWelcome();

  try {
    await startPlayback();

    ws = new WebSocket(wsUrl());
    ws.binaryType = 'arraybuffer';

    ws.onopen = async () => {
      try {
        await startMic();
        setState(STATE.ACTIVE);
      } catch (err) {
        console.error('mic error', err);
        setState(STATE.ERROR, 'Mikrofon ruqsatı kerek');
        stopSession();
      }
    };

    ws.onmessage = (evt) => {
      if (typeof evt.data === 'string') {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'transcript' && msg.final && msg.text) {
            addBubble('ai', msg.text);
          } else if (msg.type === 'audio_done') {
            // Let remaining scheduled audio finish naturally.
          } else if (msg.type === 'disconnected') {
            setState(STATE.ERROR, 'Baylanıs úzildi');
            stopSession();
          }
        } catch (_) {}
      } else if (evt.data instanceof ArrayBuffer) {
        const int16 = new Int16Array(evt.data);
        playPcmChunk(int16);
      }
    };

    ws.onerror = (err) => {
      console.error('ws error', err);
      setState(STATE.ERROR, 'Server tabılmadı');
      stopSession();
    };

    ws.onclose = () => {
      if (currentState === STATE.ACTIVE || currentState === STATE.CONNECTING) {
        stopSession();
      }
    };

  } catch (err) {
    console.error('start error', err);
    setState(STATE.ERROR, err.message || 'Qátelik júz berdi');
    stopSession();
  }
}

async function stopSession() {
  if (currentState !== STATE.IDLE) setState(STATE.DISCONNECTING);
  await stopMic();
  await stopPlayback();
  if (ws) {
    try { ws.close(); } catch (_) {}
    ws = null;
  }
  if (currentState !== STATE.ERROR) setState(STATE.IDLE);
}

async function toggleSession() {
  if (currentState === STATE.IDLE || currentState === STATE.ERROR) {
    await startSession();
  } else if (currentState === STATE.ACTIVE) {
    await stopSession();
  }
}

// ─── Settings ──────────────────────────────────────────────────────────────
async function openSettings() {
  $('wsUrl').value = wsUrl();
  // List mics (requires permission prompt once)
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ audio: true });
    tmp.getTracks().forEach(t => t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d => d.kind === 'audioinput');
    const sel = $('micSelect');
    sel.innerHTML = '';
    const savedId = localStorage.getItem('kiosk_mic_id') || '';
    if (!mics.length) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '(tabılmadı)';
      sel.appendChild(opt);
    }
    mics.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.deviceId;
      opt.textContent = m.label || ('Mic ' + m.deviceId.slice(0, 6));
      if (m.deviceId === savedId) opt.selected = true;
      sel.appendChild(opt);
    });
  } catch (err) {
    console.error('enumerate error', err);
  }
  $('settingsModal').classList.add('show');
}

function closeSettings() {
  $('settingsModal').classList.remove('show');
}

function saveSettings() {
  const micId = $('micSelect').value;
  const url = $('wsUrl').value.trim();
  if (micId) localStorage.setItem('kiosk_mic_id', micId);
  else localStorage.removeItem('kiosk_mic_id');
  if (url) localStorage.setItem('kiosk_ws_url', url);
  closeSettings();
}

// Init
setState(STATE.IDLE);
</script>
