[project]
name = "kkmi-kiosk-backend"
version = "0.1.0"
description = "Backend for the KKMI AI kiosk (FastAPI + Postgres + HEMIS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "pyotp>=2.9",
    "qrcode[pil]>=8.0",
    "reportlab>=4.2",
    "redis>=5.0",
    "structlog>=24.4",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "google-genai>=0.3",
    "PyYAML>=6.0",
    "uuid7>=0.1.0",
    # Renders a scanned book's pages for the kiosk reader. PDFium via a
    # manylinux wheel — no poppler, no apt line in the image.
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = [
    "E501",
    # The AI prompt sections, seed data and receipt strings are written in
    # Uzbek/Karakalpak/Russian Cyrillic. RUF001-003 flag every Cyrillic
    # character that resembles a Latin one — 105 of 146 findings were this,
    # all false positives on a deliberately multilingual codebase.
    "RUF001",
    "RUF002",
    "RUF003",
    # FastAPI's dependency-injection idiom is `x = Depends(...)` in the
    # signature default. Flagging it would mean rewriting every endpoint.
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
