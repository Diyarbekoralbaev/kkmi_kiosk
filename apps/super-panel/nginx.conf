# SPA static server. The single tricky bit is `try_files ... /index.html` — without
# it, hard-refreshing on a client-side route like /releases would 404 because
# nginx tries to find /releases on disk. Falling back to /index.html lets React
# Router pick up the URL.
#
# Caddy in front handles TLS, HSTS, gzip — we just serve raw bytes.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames (vite-build/assets/*.js) — cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else falls through to the SPA shell. Don't cache index.html
    # (so deploys roll out instantly).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Tiny security headers (Caddy adds the rest).
    add_header X-Content-Type-Options "nosniff" always;
}
