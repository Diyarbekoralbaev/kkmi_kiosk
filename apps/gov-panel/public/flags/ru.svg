<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40" role="img" aria-label="Rossiya bayrog'i">
  <!-- Three equal horizontal bands: white / blue / red.
       Aspect 3:2 (official). Colors per the Russian Federation flag spec:
       white #ffffff, navy blue #0039a6, red #d52b1e. -->
  <rect width="60" height="13.33" y="0"     fill="#ffffff"/>
  <rect width="60" height="13.34" y="13.33" fill="#0039a6"/>
  <rect width="60" height="13.33" y="26.67" fill="#d52b1e"/>
</svg>
